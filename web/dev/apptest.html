<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>App test</title>
  <link rel="icon" href="data:,">
  <style>
    body { margin: 0; padding: 24px; background: #131e2a; color: #efe4c6; font: 14px/1.5 ui-monospace, Menlo, Consolas, monospace; }
    h1 { font: 600 16px/1.2 system-ui, sans-serif; margin: 0 0 12px; }
    .PASS { color: #8ff07c; }
    .FAIL { color: #ff8a72; }
    #sum { margin: 12px 0; font-weight: 700; }
    iframe { width: 1280px; height: 800px; border: 1px solid #3a4a5c; background: #0d141c; }
  </style>
</head>
<body>
  <h1>App test: the whole site, driven in a frame</h1>
  <p>Runs <code>app.cases.js</code> against <code>../index.html</code>. Serve <code>web/</code> over HTTP
    (<code>uv run python -m pipeline serve</code>) and open <code>/dev/apptest.html</code>. Takes about a minute.</p>
  <div id="out">Running…</div>
  <div id="sum"></div>
  <iframe id="site" title="The site under test"></iframe>
  <script type="module">
    import { run } from "./selftest.run.js";
    const frame = document.getElementById("site");

    // Load the site at that address (a fresh document each time) and resolve once it and its extensions are up.
    function open(hash = "") {
      return new Promise((resolve, reject) => {
        const timer = setTimeout(() => reject(new Error(`the site did not start (#${hash})`)), 30000);
        frame.onload = async () => {
          const win = frame.contentWindow;
          for (;;) {
            const app = win.__app;
            if (app?.extensions) break; // set once every extension has installed (ext/index.js)
            await new Promise((r) => setTimeout(r, 25));
          }
          await new Promise((r) => setTimeout(r, 60)); // hash keys registered by extensions apply in a microtask
          clearTimeout(timer);
          resolve({ app: win.__app, win, doc: win.document });
        };
        frame.src = `../index.html?run=${Date.now()}${hash ? `#${hash}` : ""}`;
      });
    }

    const { passed, failed, lines } = await run((name) => import(name), { files: ["./app.cases.js"], ctx: { open } });
    const out = document.getElementById("out");
    out.textContent = "";
    for (const l of lines) {
      const div = document.createElement("div");
      div.className = l.slice(0, 4);
      div.textContent = l;
      out.appendChild(div);
    }
    const sum = document.getElementById("sum");
    sum.textContent = `${passed} passed, ${failed} failed`;
    sum.className = failed ? "FAIL" : "PASS";
    window.__apptest = { passed, failed, lines };
  </script>
</body>
</html>
