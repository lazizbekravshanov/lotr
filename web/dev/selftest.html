<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Self-test</title>
  <link rel="icon" href="data:,">
  <style>
    body { margin: 0; padding: 24px; background: #131e2a; color: #efe4c6; font: 14px/1.5 ui-monospace, Menlo, Consolas, monospace; }
    h1 { font: 600 16px/1.2 system-ui, sans-serif; margin: 0 0 12px; }
    .PASS { color: #8ff07c; }
    .FAIL { color: #ff8a72; }
    #sum { margin-top: 12px; font-weight: 700; }
  </style>
</head>
<body>
  <h1>Self-test: browser modules</h1>
  <div id="out">Running…</div>
  <div id="sum"></div>
  <script type="module">
    import { run } from "./selftest.run.js";
    const { passed, failed, lines } = await run((name) => import(name));
    const out = document.getElementById("out");
    out.textContent = "";
    for (const l of lines) {
      const div = document.createElement("div");
      div.className = l.slice(0, 4);
      div.textContent = l;
      out.appendChild(div);
    }
    const sum = document.getElementById("sum");
    sum.textContent = `${passed} passed, ${failed} failed`;
    sum.className = failed ? "FAIL" : "PASS";
    window.__selftest = { passed, failed, lines };
  </script>
</body>
</html>
